services:
  - type: web
    name: pesight-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.16
      - key: DATABASE_URL
        fromDatabase:
          name: pesight-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      # Email codes (password reset, two-step sign-in) are sent through Brevo.
      # sync: false = the value is typed into Render's Environment tab, never stored here.
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

databases:
  - name: pesight-db
    plan: free
    region: frankfurt
    databaseName: pesight
    user: pesight